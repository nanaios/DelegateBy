name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Package and validate
        uses: ./.github/actions/package
